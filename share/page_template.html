<style>
/* ท้องฟ้าราตรีม่วง-ฟ้าเป็นแถบเปิด แล้วเนื้อหาเป็นการ์ดขาวมนลอยบนพื้นสว่าง
   ฟ้าอมเขียวเป็นสีนำหนึ่งเดียว เหลืองอำพันสงวนไว้ให้เลขที่ค้นเจอเท่านั้น
   ตารางไม่มีเส้นตั้ง เหลือเส้นนอนบางที่สุด ให้ตัวเลขเป็นพระเอก */
:root {
  color-scheme: light;

  --night-1: #2e1d6e;
  --night-2: #1d1148;
  --night-3: #120a2e;

  --aqua: #5ee7f5;
  --aqua-deep: #0e7490;
  --brand: #7c5cf0;
  --brand-deep: #4c2fc7;
  --flash: #fcd34d;
  --flash-ink: #6b4708;

  --bg: #f5f5fb;
  --card: #ffffff;
  --card-2: #f3f2fb;
  --hair: #e9e7f5;
  --ink: #1d1a3d;
  --ink-2: #5f5b86;
  --ink-3: #8e8ab0;
  --sky-ink: #ffffff;
  --sky-ink-2: #c9c2f6;

  --p-violet: #ede9fe;
  --p-blue: #e0f2fe;
  --p-pink: #fce7f3;
  --p-green: #dcfce7;
  --p-amber: #fef3c7;

  --display: "Anuphan", "Noto Sans Thai", system-ui, sans-serif;
  --body: "IBM Plex Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  --mono: "IBM Plex Mono", "Cascadia Mono", ui-monospace, monospace;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 24px;
  --shadow: 0 1px 2px rgba(29, 26, 61, .05), 0 12px 32px -12px rgba(29, 26, 61, .14);
  --shadow-lift: 0 2px 4px rgba(29, 26, 61, .06), 0 22px 48px -16px rgba(29, 26, 61, .22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #100c26;
    --card: #1a1640;
    --card-2: #221d52;
    --hair: #2e2763;
    --ink: #f0eefc;
    --ink-2: #b0a9dc;
    --ink-3: #8179b8;
    --p-violet: #2a2160;
    --p-blue: #16314f;
    --p-pink: #3d1b38;
    --p-green: #14352a;
  --p-amber: #3d2f07;
    --flash: #7a5a09;
    --flash-ink: #fde68a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -12px rgba(0, 0, 0, .6);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .35), 0 22px 48px -16px rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #100c26;
  --card: #1a1640;
  --card-2: #221d52;
  --hair: #2e2763;
  --ink: #f0eefc;
  --ink-2: #b0a9dc;
  --ink-3: #8179b8;
  --p-violet: #2a2160;
  --p-blue: #16314f;
  --p-pink: #3d1b38;
  --p-green: #14352a;
  --p-amber: #3d2f07;
  --flash: #7a5a09;
  --flash-ink: #fde68a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -12px rgba(0, 0, 0, .6);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .35), 0 22px 48px -16px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
}
.gut {
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.shell { max-width: 1200px; margin: 0 auto; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--night-1);
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }

/* ===================================================== ท้องฟ้า */
.sky {
  position: relative;
  background:
    radial-gradient(90% 70% at 12% 8%, rgba(129, 140, 248, .55) 0%, transparent 60%),
    radial-gradient(70% 60% at 78% 4%, rgba(232, 121, 249, .40) 0%, transparent 62%),
    radial-gradient(85% 75% at 92% 56%, rgba(34, 211, 238, .30) 0%, transparent 60%),
    linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 52%, var(--night-3) 100%);
  color: var(--sky-ink);
  overflow: hidden;
  isolation: isolate;
}
.sky::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(2px 2px at 14% 26%, rgba(255,255,255,.8), transparent),
    radial-gradient(2px 2px at 72% 14%, rgba(255,255,255,.65), transparent),
    radial-gradient(1.5px 1.5px at 34% 62%, rgba(255,255,255,.5), transparent),
    radial-gradient(2px 2px at 88% 38%, rgba(255,255,255,.55), transparent),
    radial-gradient(1.5px 1.5px at 56% 82%, rgba(255,255,255,.4), transparent),
    radial-gradient(2px 2px at 24% 88%, rgba(255,255,255,.35), transparent);
}
.skyline {
  position: absolute; left: 0; right: 0; bottom: -1px; z-index: 0;
  width: 100%; height: auto; opacity: .5; pointer-events: none;
}

.topbar {
  position: relative; z-index: 3;
  display: flex; align-items: center; gap: 18px;
  padding-block: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand b { font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: .01em; }
.topnav { display: flex; gap: 4px; flex-wrap: wrap; }
.topnav button {
  font: inherit; font-size: 14px; cursor: pointer; color: var(--sky-ink-2);
  background: none; border: 0; padding: 7px 13px; border-radius: 999px; position: relative;
}
.topnav button:hover { color: #fff; }
.topnav button[aria-selected="true"] { color: #fff; font-weight: 600; }
.topnav button[aria-selected="true"]::after {
  content: ""; position: absolute; left: 13px; right: 13px; bottom: 1px;
  height: 2.5px; border-radius: 2px; background: var(--aqua);
}
.topcta {
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  color: var(--aqua-deep); background: #d7f7fb; border: 0;
  padding: 9px 18px; border-radius: 999px; white-space: nowrap;
}
.topcta:hover { background: #fff; }

.hero {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .92fr);
  gap: 24px 36px; align-items: center;
  padding-block: 18px 92px;
}
.kicker {
  font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--aqua); margin: 0 0 14px; font-family: var(--mono); font-weight: 600;
}
.hero h1 { font-size: clamp(32px, 5.6vw, 58px); line-height: 1.12; font-weight: 700; }
.hero h1 .glow {
  background: linear-gradient(100deg, #a5f3fc 0%, var(--aqua) 48%, #c4b5fd 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.lede { margin: 16px 0 0; max-width: 44ch; color: var(--sky-ink-2); font-size: 15.5px; }
.cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.cta {
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; gap: 9px;
  padding: 13px 24px; border-radius: 999px; border: 0;
  background: linear-gradient(100deg, #7ff0fb, #37c7e8);
  color: #06323d; box-shadow: 0 10px 26px -8px rgba(94, 231, 245, .7);
}
.cta:hover { filter: brightness(1.06); }
.cta.ghost {
  background: rgba(255, 255, 255, .07); color: #fff;
  border: 1.5px solid rgba(255, 255, 255, .34); box-shadow: none;
}
.cta.ghost:hover { background: rgba(255, 255, 255, .15); }
.hero-art { position: relative; display: flex; justify-content: center; }
.hero-art svg {
  width: 100%; max-width: 520px; height: auto;
  filter: drop-shadow(0 24px 48px rgba(10, 5, 40, .5));
}

.quick-wrap { position: relative; z-index: 5; margin-top: -62px; }
.quick {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(206px, 1fr));
  gap: 1px; background: var(--hair);
  border-radius: var(--r-lg); box-shadow: var(--shadow-lift); overflow: hidden;
}
.quick button {
  font: inherit; text-align: left; cursor: pointer; background: var(--card); border: 0;
  display: flex; align-items: center; gap: 12px; padding: 18px 16px; color: var(--ink);
}
.quick button:hover, .quick button[aria-selected="true"] { background: var(--card-2); }
.badge { width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center; }
.q-txt { display: flex; flex-direction: column; min-width: 0; }
.q-txt b { font-family: var(--display); font-weight: 600; font-size: 15px; }
.q-txt span { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }
.q-arrow { margin-left: auto; color: var(--ink-3); flex: none; }

/* ===================================================== แถบควบคุม */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--hair);
  margin-top: 30px;
}
.bar-in { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; padding-block: 14px; }
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field > label {
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600; font-family: var(--mono);
}
.rows { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  font: inherit; font-size: 13px; cursor: pointer; color: var(--ink-2);
  background: var(--card); border: 1px solid var(--hair);
  border-radius: 999px; padding: 6px 14px; white-space: nowrap;
}
.chips button:hover { border-color: var(--brand); color: var(--ink); }
.chips button[aria-pressed="true"] {
  background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600;
}
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--hair);
  border-radius: 999px; padding: 6px 14px;
}
.search input {
  font: inherit; font-family: var(--mono); font-size: 14px; border: 0; outline: 0;
  background: none; color: var(--ink); width: 9ch; padding: 0;
}
.search input.wide { width: 12ch; }
.search input::placeholder { font-family: var(--body); color: var(--ink-3); }
select {
  font: inherit; font-size: 14px; padding: 8px 13px; border-radius: 999px;
  border: 1px solid var(--hair); background: var(--card); color: var(--ink); cursor: pointer;
}

/* ===================================================== เนื้อหา */
main { padding-block: 26px 10px; }
.panel {
  background: var(--card); border-radius: var(--r-lg);
  box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px;
}
.panel-head {
  display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline;
  justify-content: space-between; padding: 20px 22px 16px;
}
.panel-head h2 { font-size: 19px; }
.meta { color: var(--ink-3); font-size: 12.5px; }
.legend {
  display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
  padding: 0 22px 18px; color: var(--ink-3); font-size: 12.5px;
}
.legend i { font-style: normal; color: var(--ink-2); }
.key {
  display: inline-grid; place-items: center; min-width: 19px; height: 19px;
  padding: 0 5px; border-radius: 6px; font-family: var(--mono); font-size: 10.5px; font-weight: 600;
}
.key.star { background: var(--p-violet); color: var(--brand-deep); }
.key.off { background: var(--card-2); color: var(--ink-3); }
.key.plus { background: var(--p-blue); color: var(--aqua-deep); }
.key.lit { background: var(--flash); color: var(--flash-ink); }

.pan { overflow: auto; max-height: min(72vh, 760px); }
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
table.grid th, table.grid td {
  padding: 7px 8px; text-align: center; vertical-align: top; white-space: nowrap;
  border-bottom: 1px solid var(--hair);
}
table.grid thead th {
  position: sticky; top: 0; z-index: 3; background: var(--card);
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em; font-weight: 600;
  color: var(--ink-3); padding-block: 12px;
}
table.grid th.yr {
  position: sticky; left: 0; z-index: 2; background: var(--card);
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600;
  text-align: right; font-size: 13.5px; min-width: 60px; color: var(--ink-2); padding-right: 14px;
}
table.grid thead th.corner { z-index: 4; left: 0; text-align: right; padding-right: 14px; }
table.grid tbody tr:last-child th, table.grid tbody tr:last-child td { border-bottom: 0; }
table.grid td.on { background: var(--card-2); }
table.grid thead th.on { color: var(--brand); }
table.grid th.yr.on { background: var(--card-2); color: var(--brand); }

.stack { display: flex; flex-direction: column; gap: 3px; }
.cell {
  display: flex; gap: 6px; align-items: baseline; justify-content: center;
  flex-wrap: wrap; row-gap: 2px;
  border: 0; background: none; color: inherit; width: 100%;
  padding: 3px 5px; border-radius: 8px; cursor: pointer;
}
.cell:hover { background: var(--p-violet); }
.cell .d {
  font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right;
}
.cell .n {
  font-family: var(--mono); font-weight: 600; font-size: 13.5px;
  font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: .01em;
}
.cell .star { color: var(--brand); font-weight: 700; }
.cell .more {
  font-family: var(--mono); font-size: 10px; color: var(--aqua-deep);
  background: var(--p-blue); border-radius: 5px; padding: 0 4px; align-self: center;
}
.cell.lit { background: var(--flash); }
.cell.lit .n, .cell.lit .d, .cell.lit .star { color: var(--flash-ink); }
.cell.lit .more { background: rgba(0, 0, 0, .09); color: var(--flash-ink); }
.cell.off { cursor: default; opacity: .6; }
.cell.off:hover { background: none; }
.cell.off .n { font-family: var(--body); font-size: 11px; font-weight: 400; color: var(--ink-3); }
.nil { color: var(--hair); font-family: var(--mono); }

.tier { padding: 18px 22px; border-top: 1px solid var(--hair); }
.tier-head {
  display: flex; flex-wrap: wrap; gap: 4px 12px;
  justify-content: space-between; align-items: baseline; margin-bottom: 11px;
}
.tier-head b { font-family: var(--display); font-weight: 600; font-size: 15px; }
.tier-head span { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.balls { display: flex; flex-wrap: wrap; gap: 6px; }
.b {
  font-family: var(--mono); font-size: 13.5px; font-weight: 500;
  font-variant-numeric: tabular-nums; letter-spacing: .04em;
  padding: 6px 10px; border-radius: var(--r-sm);
  background: var(--card-2); color: var(--ink);
}
.b.one {
  font-size: clamp(30px, 7vw, 46px); font-weight: 600; letter-spacing: .1em;
  padding: 14px 26px; border-radius: var(--r-md);
  background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #fff;
  box-shadow: 0 14px 30px -12px rgba(76, 47, 199, .7);
}
.b.two { font-size: 18px; font-weight: 600; padding: 9px 14px; }
.nav-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 22px 4px; }
.pill {
  font: inherit; font-size: 13.5px; cursor: pointer; color: var(--ink-2);
  background: var(--card-2); border: 0; border-radius: 999px; padding: 8px 16px;
}
.pill:hover { background: var(--p-violet); color: var(--ink); }
.callout {
  margin: 14px 22px 4px; padding: 12px 16px; border-radius: var(--r-md);
  background: var(--p-violet); color: var(--brand-deep); font-size: 13px;
}

.verdict { padding: 24px 22px; }
.verdict.win { background: linear-gradient(135deg, var(--p-violet), var(--p-blue)); }
.verdict h3 { font-size: 20px; margin-bottom: 6px; }
.verdict .sum { color: var(--ink-2); font-size: 13.5px; margin: 0; }
.wins { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.wincard {
  background: var(--card); border-radius: var(--r-md); padding: 12px 16px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px;
}
.wincard span { font-size: 11.5px; color: var(--ink-3); }
.wincard b { font-family: var(--mono); font-size: 18px; letter-spacing: .06em; }

table.list { border-collapse: collapse; width: 100%; font-size: 14px; }
table.list th, table.list td { text-align: left; padding: 11px 22px; border-bottom: 1px solid var(--hair); }
table.list th {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); font-weight: 600;
}
table.list tbody tr:last-child td { border-bottom: 0; }
table.list tbody tr.tap { cursor: pointer; }
table.list tbody tr.tap:hover { background: var(--card-2); }
table.list .n {
  font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .04em;
}
.wrapx { overflow-x: auto; }

.ranks { padding: 6px 22px 20px; display: flex; flex-direction: column; }
.rank {
  display: grid; grid-template-columns: 2.5ch 7ch 1fr auto;
  gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--hair);
}
.rank:last-child { border-bottom: 0; }
.rank .pos { font-family: var(--mono); font-size: 12px; color: var(--ink-3); text-align: right; }
.rank .num {
  font-family: var(--mono); font-size: 16px; font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: .06em;
}
.track { height: 9px; border-radius: 5px; background: var(--card-2); overflow: hidden; }
.fill { height: 100%; border-radius: 5px; background: var(--brand); }
.rank .val {
  font-family: var(--mono); font-size: 13px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pool { padding: 4px 22px 22px; display: flex; flex-wrap: wrap; gap: 6px; }
.pool b {
  font-family: var(--mono); font-weight: 500; font-size: 13px;
  background: var(--card-2); color: var(--ink-2); padding: 5px 9px; border-radius: var(--r-sm);
}

/* ---- เก็งเลข ---- */
.odds { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 1px; background: var(--hair); }
.odds > div { background: var(--card); padding: 24px 22px; }
.bignum {
  font-family: var(--mono); font-size: clamp(42px, 11vw, 68px); font-weight: 600;
  letter-spacing: .12em; line-height: 1.05; color: var(--ink);
}
.chance {
  font-family: var(--display); font-size: clamp(26px, 6vw, 36px); font-weight: 700;
  color: var(--brand); line-height: 1.1; margin-top: 4px;
}
.chance small { font-family: var(--body); font-size: 14px; font-weight: 400; color: var(--ink-3); display: block; }
.facts { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
.fact {
  display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
  padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px;
}
.fact:last-child { border-bottom: 0; }
.fact span { color: var(--ink-3); }
.fact b { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.tag {
  display: inline-block; font-size: 12px; font-weight: 600; padding: 5px 12px;
  border-radius: 999px; margin-top: 12px;
}
.tag.norm { background: var(--p-blue); color: var(--aqua-deep); }
.tag.high { background: var(--p-pink); color: #9d174d; }
.tag.low { background: var(--p-violet); color: var(--brand-deep); }
.tag.zero { background: var(--card-2); color: var(--ink-2); }
.years { display: flex; gap: 3px; margin-top: 14px; flex-wrap: wrap; }
.years i {
  width: 22px; height: 26px; border-radius: 5px; background: var(--card-2);
  display: grid; place-items: center; font-style: normal;
  font-family: var(--mono); font-size: 9.5px; color: var(--ink-3);
}

<script>
"use strict";
const DB = JSON.parse(document.getElementById("lotto-data").textContent);

const MONTH_FULL = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
                    "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const MONTH_ABBR = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.",
                    "ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

const TIERS = DB.tiers;
const INDEX = Object.fromEntries(TIERS.map((t, i) => [t.key, i]));
const TIER_ROWS = DB.tier_groups || [TIERS.map((t) => t.key)];
const SMALL_TIERS = TIERS.filter((t) => t.digits <= 3).map((t) => t.key);
const CELL_MAX = 12;
const STAR = '<span class="star">*</span>';

const DATES = Object.keys(DB.draws).sort();
const LATEST = DATES[DATES.length - 1];

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const group = (n) => n.toLocaleString("th-TH");
const thaiDate = (iso) => {
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} ${MONTH_FULL[m - 1]} ${y + 543}`;
};

function split(packed, digits) {
  const out = [];
  for (let i = 0; i + digits <= packed.length; i += digits) out.push(packed.slice(i, i + digits));
  return out;
}
function numbersOf(date, key) {
  const row = DB.draws[date];
  if (!row) return [];
  return split(row[INDEX[key]] || "", TIERS[INDEX[key]].digits);
}

const view = {
  name: "grid", tier: "last2", slot: "all", lit: "",
  date: LATEST, ticket: "", statTier: "last2", statMode: "top",
  pickTier: "last2", pick: "", strategy: "hot",
};

const VIEWS = [
  { key: "grid", label: "เทียบรายเดือน", sub: "เลขเดือนต่อเดือนข้ามทุกปี", tone: "p-violet", icon: "chart" },
  { key: "draw", label: "ผลทั้งงวด", sub: "ครบทั้ง 9 หมวดรางวัล", tone: "p-blue", icon: "list" },
  { key: "ticket", label: "ตรวจสลาก", sub: "เช็กย้อนหลังทั้งคลัง", tone: "p-pink", icon: "search" },
  { key: "odds", label: "เก็งเลข", sub: "โอกาสจริง + สถิติประกอบ", tone: "p-amber", icon: "dice" },
  { key: "stats", label: "สถิติย้อนหลัง", sub: "ออกบ่อย หายนาน ไม่เคยออก", tone: "p-green", icon: "spark" },
];
const ICONS = {
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  spark: '<path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/>',
  dice: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8.5 8.5h.01M15.5 15.5h.01M12 12h.01"/>',
};
const TONE_INK = { "p-violet": "var(--brand-deep)", "p-blue": "var(--aqua-deep)",
                   "p-pink": "#9d174d", "p-green": "#166534", "p-amber": "var(--flash-ink)" };

function icon(name, size = 21) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
}

document.getElementById("topnav").innerHTML = VIEWS.map((v) =>
  `<button data-view="${v.key}" aria-selected="${v.key === view.name}">${esc(v.label)}</button>`).join("");

document.getElementById("quick").innerHTML = VIEWS.map((v) => `
  <button data-view="${v.key}" aria-selected="${v.key === view.name}">
    <span class="badge" style="background: var(--${v.tone}); color: ${TONE_INK[v.tone]}">${icon(v.icon)}</span>
    <span class="q-txt"><b>${esc(v.label)}</b><span>${esc(v.sub)}</span></span>
    <svg class="q-arrow" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 6l6 6-6 6"/></svg>
  </button>`).join("");

document.getElementById("foot").innerHTML =
  `ข้อมูล ${esc(DB.synced_at || "")} · ${group(DATES.length)} งวด · ${group(DB.prize_count)} เลขรางวัล<br>` +
  `คลังย้อนหลัง <a href="https://github.com/vicha-w/thai-lotto-archive" target="_blank" rel="noreferrer">vicha-w/thai-lotto-archive</a>` +
  ` สอบทานกับ API สำนักงานสลากกินแบ่งรัฐบาล และหน้าตรวจหวยย้อนหลังของ sanook · ` +
  `โค้ด <a href="https://github.com/bomnatthasit/thai-lotto-db" target="_blank" rel="noreferrer">bomnatthasit/thai-lotto-db</a><br>` +
  `ใช้เพื่อค้นย้อนหลังเท่านั้น การขึ้นเงินรางวัลให้ยึดประกาศของสำนักงานสลากกินแบ่งรัฐบาล ` +
  `สถิติในหน้านี้เป็นการนับย้อนหลัง ไม่ใช่การทำนาย`;

function go(name) {
  view.name = name;
  render();
  document.getElementById("bar").scrollIntoView({ behavior: "smooth", block: "start" });
}
for (const host of [document.getElementById("topnav"), document.getElementById("quick")]) {
  host.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-view]");
    if (b) go(b.dataset.view);
  });
}
document.getElementById("ctaGrid").addEventListener("click", () => go("grid"));
document.getElementById("ctaCheck").addEventListener("click", () => go("ticket"));
document.getElementById("jumpTool").addEventListener("click", () => go(view.name));

function dateOptions(selected) {
  return DATES.slice().reverse().map((d) =>
    `<option value="${d}"${d === selected ? " selected" : ""}>${esc(thaiDate(d))}</option>`).join("");
}
function searchBox(id, value, placeholder, wide) {
  return `<span class="search">${icon("search", 15)}
    <input id="${id}" class="${wide ? "wide" : ""}" inputmode="numeric"
           placeholder="${placeholder}" value="${esc(value)}"></span>`;
}

function renderBar() {
  const bar = document.getElementById("barIn");

  if (view.name === "grid") {
    bar.innerHTML = `
      <div class="field"><label>รางวัล</label>
        <div class="rows" id="tierRows">${TIER_ROWS.map((row) =>
          `<div class="chips">${row.map((k) =>
            `<button data-tier="${k}" aria-pressed="${k === view.tier}">${esc(TIERS[INDEX[k]].label)}</button>`
          ).join("")}</div>`).join("")}</div>
      </div>
      <div class="field"><label>งวด</label>
        <div class="chips" id="slotChips">
          <button data-slot="all" aria-pressed="${view.slot === "all"}">ทั้งคู่</button>
          <button data-slot="1" aria-pressed="${view.slot === "1"}">วันที่ 1</button>
          <button data-slot="16" aria-pressed="${view.slot === "16"}">วันที่ 16</button>
        </div>
      </div>
      <div class="field"><label>ค้นเลขในตาราง</label>
        ${searchBox("litBox", view.lit, "เช่น 48")}
      </div>`;
    document.getElementById("tierRows").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-tier]");
      if (b) { view.tier = b.dataset.tier; render(); }
    });
    document.getElementById("slotChips").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-slot]");
      if (b) { view.slot = b.dataset.slot; render(); }
    });
    const box = document.getElementById("litBox");
    box.addEventListener("input", () => { view.lit = box.value.replace(/\D/g, ""); paintLit(); });
    return;
  }

  if (view.name === "draw") {
    bar.innerHTML = `<div class="field"><label>เลือกงวด</label>
      <select id="pick">${dateOptions(view.date)}</select></div>`;
    document.getElementById("pick").addEventListener("change", (e) => { view.date = e.target.value; render(); });
    return;
  }

  if (view.name === "ticket") {
    bar.innerHTML = `
      <div class="field"><label>เลขสลาก 6 หลัก</label>
        ${searchBox("tk", view.ticket, "011781", true)}
      </div>
      <div class="field"><label>เทียบกับงวด</label>
        <select id="tkDate">${dateOptions(view.date)}</select>
      </div>`;

function gridRows() {
  const tier = TIERS[INDEX[view.tier]];
  const cells = [];
  for (const date of DATES) {
    const period = DB.periods[date] || date;
    cells.push({
      period, slot: Number(period.slice(-2)), date, day: Number(date.slice(-2)),
      nums: numbersOf(date, view.tier),
      shifted: period.slice(0, 7) !== date.slice(0, 7),
      cancelled: false, note: DB.shift_notes[date] || null,
    });
  }
  for (const [period, note] of Object.entries(DB.cancelled || {})) {
    if (period < DATES[0] || period > LATEST) continue;
    cells.push({ period, slot: Number(period.slice(-2)), date: null, day: null,
                 nums: [], shifted: false, cancelled: true, note });
  }

  const kept = view.slot === "all" ? cells : cells.filter((c) => c.slot === Number(view.slot));
  const byYear = new Map();
  for (const c of kept) {
    const y = Number(c.period.slice(0, 4));
    const m = Number(c.period.slice(5, 7));
    if (!byYear.has(y)) byYear.set(y, Array.from({ length: 12 }, () => []));
    byYear.get(y)[m - 1].push(c);
  }
  for (const months of byYear.values()) for (const b of months) b.sort((a, z) => a.slot - z.slot);

  return {
    tier, years: [...byYear.entries()].sort((a, b) => b[0] - a[0]),
    shifted: kept.filter((c) => c.shifted).length,
    cancelled: kept.filter((c) => c.cancelled).length,
    biggest: kept.reduce((m, c) => Math.max(m, c.nums.length), 0),
  };
}

function renderGrid() {
  const g = gridRows();
  const head = `<thead><tr><th class="yr corner">ปี พ.ศ.</th>${
    MONTH_ABBR.map((m) => `<th>${m}</th>`).join("")}</tr></thead>`;

  const body = g.years.map(([year, months]) => {
    const cells = months.map((slots) => {
      if (!slots.length) return `<td><span class="nil">·</span></td>`;
      const chips = slots.map((c) => {
        if (c.cancelled) {
          return `<span class="cell off" title="${esc(c.note || "")}">
            <span class="d">${c.slot}</span><span class="n">งดจำหน่าย</span></span>`;
        }
        const tip = c.shifted
          ? `งวด ${thaiDate(c.period)} ออกรางวัลวันที่ ${thaiDate(c.date)}`
          : `ดูผลทั้งงวด ${thaiDate(c.date)}`;
        const shown = c.nums.slice(0, CELL_MAX);
        const rest = c.nums.length - shown.length;
        return `<button class="cell" data-date="${c.date}" data-n="${esc(c.nums.join(" "))}"
          title="${esc(tip)}"><span class="d">${c.day}</span><span class="n">${
          esc(shown.join(" "))}${c.shifted ? STAR : ""}</span>${
          rest > 0 ? `<span class="more">+${rest}</span>` : ""}</button>`;
      }).join("");
      return `<td><div class="stack">${chips}</div></td>`;
    }).join("");
    return `<tr><th class="yr">${year + 543}</th>${cells}</tr>`;
  }).join("");

  const slotText = { all: "งวดวันที่ 1 และ 16", "1": "เฉพาะงวดวันที่ 1", "16": "เฉพาะงวดวันที่ 16" }[view.slot];
  return `<section class="panel">
    <div class="panel-head">
      <h2>${esc(g.tier.label)}</h2>
      <span class="meta">${g.years.length} ปี · ${esc(slotText)} · คลิกเลขเพื่อดูผลทั้งงวด</span>
    </div>
    <div class="legend">
      <span><span class="key star">*</span> <i>ออกคนละเดือนกับงวด</i> ${g.shifted} งวด</span>
      <span><span class="key off">—</span> <i>งดจำหน่าย</i> ${g.cancelled} งวด</span>
      ${g.biggest > CELL_MAX ? `<span><span class="key plus">+N</span>
        <i>ยังมีอีก N เลข</i> พิมพ์ในช่องค้นเพื่อดึงขึ้นมา</span>` : ""}
      <span><span class="key lit">48</span> <i>เลขที่ค้นเจอ</i></span>
    </div>
    <div class="pan"><table class="grid">${head}<tbody>${body}</tbody></table></div>
  </section>`;
}

function wireGrid() {
  const table = document.querySelector("table.grid");
  if (!table) return;
  table.addEventListener("click", (e) => {
    const cell = e.target.closest(".cell[data-date]");
    if (cell) { view.date = cell.dataset.date; go("draw"); }
  });
  table.addEventListener("mouseover", (e) => {
    const td = e.target.closest("td, th");
    if (!td) return;
    const col = td.cellIndex;
    table.querySelectorAll(".on").forEach((el) => el.classList.remove("on"));
    if (col > 0) for (const tr of table.rows) tr.cells[col]?.classList.add("on");
  });
  table.addEventListener("mouseleave", () =>
    table.querySelectorAll(".on").forEach((el) => el.classList.remove("on")));
  paintLit();
}

function paintLit() {
  const needle = view.lit;
  document.querySelectorAll(".cell[data-n]").forEach((cell) => {
    const nums = cell.dataset.n ? cell.dataset.n.split(" ") : [];
    const matches = needle ? nums.filter((n) => n.includes(needle)) : [];
    const shown = (matches.length ? matches : nums).slice(0, CELL_MAX);
    const star = cell.querySelector(".star") ? STAR : "";
    cell.querySelector(".n").innerHTML = esc(shown.join(" ")) + star;
    const more = cell.querySelector(".more");
    if (more) {
      const rest = nums.length - shown.length;
      more.textContent = rest > 0 ? `+${rest}` : "";
    }
    cell.classList.toggle("lit", matches.length > 0);
  });
}

function winsFor(ticket, date) {
  const out = [];
  for (const tier of TIERS) {
    for (const n of numbersOf(date, tier.key)) {
      const hit = tier.match === "exact" ? ticket === n
                : tier.match === "prefix" ? ticket.startsWith(n)
                : ticket.endsWith(n);
      if (hit) out.push({ tier, n });
    }
  }
  return out;
}

const renderTicket = () => `<div id="tkOut"></div>`;

  if (!host) return;

  if (ticket.length !== 6) {
    host.innerHTML = `<section class="panel"><div class="verdict">

  }

  const now = winsFor(ticket, view.date);
  const verdict = now.length

         <h3>ถูกรางวัล ${now.length} รายการ</h3>

  const past = [];
  for (const date of DATES.slice().reverse()) {

    if (w.length) past.push({ date, wins: w });
  }

  const history = past.length
    ? `<div class="wrapx"><table class="list">
         <thead><tr><th>งวด</th><th>รางวัลที่ถูก</th></tr></thead>
         <tbody>${past.map((p) => `<tr class="tap" data-date="${p.date}">

           <td>${p.wins.map((w) => `${esc(w.tier.label)} <span class="n">${esc(w.n)}</span>`).join("<br>")}</td>
         </tr>`).join("")}</tbody></table></div>`
    : `<p class="meta" style="padding:0 22px 22px">เลขนี้ไม่เคยถูกรางวัลเลยใน ${group(DATES.length)} งวด</p>`;

    <section class="panel">
      <div class="panel-head">
        <h2>ย้อนดูเลข ${esc(ticket)} ทั้งคลัง</h2>
        <span class="meta">ถูก ${past.length} จาก ${group(DATES.length)} งวด
          (${(past.length / DATES.length * 100).toFixed(1)}%)</span>

      ${history}
    </section>`;

  host.querySelectorAll("tr[data-date]").forEach((tr) =>
    tr.addEventListener("click", () => { view.date = tr.dataset.date; go("draw"); }));
}

function tally(key) {
  const counts = new Map();
  const last = new Map();
  for (const date of DATES) {
    for (const n of numbersOf(date, key)) {
      counts.set(n, (counts.get(n) || 0) + 1);
      last.set(n, date);
    }
  }
  return { counts, last };
}

function renderStats() {
  const key = view.statTier;
  const tier = TIERS[INDEX[key]];
  const { counts, last } = tally(key);
  const space = 10 ** tier.digits;

  if (view.statMode === "never") {
    const missing = [];
    for (let i = 0; i < space; i++) {
      const n = String(i).padStart(tier.digits, "0");
      if (!counts.has(n)) missing.push(n);
    }
    return `<section class="panel">
      <div class="panel-head"><h2>${esc(tier.label)} · ยังไม่เคยออก</h2>
        <span class="meta">${group(missing.length)} จาก ${group(space)} เลข</span></div>
      <div class="pool">${missing.map((n) => `<b>${n}</b>`).join("")}</div>
    </section>`;
  }

  let rows;
  let unit;
  if (view.statMode === "gap") {
    const after = (d) => DATES.length - 1 - DATES.indexOf(d);
    rows = [...last.entries()].map(([n, d]) => ({ n, v: after(d), note: thaiDate(d) }))
      .sort((a, b) => b.v - a.v).slice(0, 24);
    unit = "งวด";
  } else {
    rows = [...counts.entries()].map(([n, v]) => ({ n, v, note: thaiDate(last.get(n)) }));
    rows.sort((a, b) => view.statMode === "low" ? a.v - b.v || a.n.localeCompare(b.n)
                                                : b.v - a.v || a.n.localeCompare(b.n));
    rows = rows.slice(0, 24);
    unit = "ครั้ง";
  }

  const top = Math.max(...rows.map((r) => r.v), 1);
  const title = { top: "ออกบ่อยสุด", low: "ออกน้อยสุด", gap: "หายไปนานสุด" }[view.statMode];

  return `<section class="panel">
    <div class="panel-head"><h2>${esc(tier.label)} · ${title}</h2>
      <span class="meta">จาก ${group(DATES.length)} งวด · ชี้ที่แถวเพื่อดูงวดล่าสุดที่ออก</span></div>
    <div class="ranks">${rows.map((r, i) => `
      <div class="rank" title="ออกครั้งล่าสุด ${esc(r.note)}">
        <span class="pos">${i + 1}</span>
        <span class="num">${esc(r.n)}</span>
        <span class="track"><span class="fill" style="width:${Math.max(4, r.v / top * 100)}%"></span></span>
        <span class="val">${group(r.v)} ${unit}</span>
      </div>`).join("")}</div>
  </section>`;
}

/* ------------------------------------------------------- เก็งเลข
   โอกาสถูกรางวัลงวดหน้าคิดจากกติกา ไม่ใช่จากสถิติ — ทุกเลขเท่ากันเสมอ
   สถิติย้อนหลังใส่ไว้ให้ประกอบการเลือก และบอกตรง ๆ ว่าส่วนต่างอยู่ในช่วง
   ที่ความบังเอิญอธิบายได้หรือไม่ */
function tierStats(key) {
  const tier = TIERS[INDEX[key]];
  const space = 10 ** tier.digits;
  const counts = new Map(), last = new Map(), byYear = new Map();
  let trials = 0;
  for (const date of DATES) {
    const nums = numbersOf(date, key);
    trials += nums.length;
    const y = Number(date.slice(0, 4));
    for (const n of nums) {
      counts.set(n, (counts.get(n) || 0) + 1);
      last.set(n, date);
      if (!byYear.has(n)) byYear.set(n, new Map());
      const m = byYear.get(n);
      m.set(y, (m.get(y) || 0) + 1);
    }
  }
  const perDraw = numbersOf(LATEST, key).length || 1;
  return {
    tier, space, counts, last, byYear, trials, perDraw,
    p: perDraw / space,
    expected: trials / space,
    sd: Math.sqrt(trials * (1 / space) * (1 - 1 / space)),
  };
}

function gapOf(date) { return DATES.length - 1 - DATES.indexOf(date); }
const pct = (x) => (x * 100).toFixed(x < 0.001 ? 4 : 2).replace(/\.?0+$/, "") + "%";

function oddsCard(st) {
  const n = view.pick;
  if (n.length !== st.tier.digits) {
    return `<div class="odds"><div>
        <h2>เลือกเลขที่ชอบก่อน</h2>
        <p class="meta" style="margin-top:8px">พิมพ์เลข ${st.tier.digits} หลักในช่องด้านบน
        หรือกดเลขจากตารางข้างล่าง แล้วจะเห็นโอกาสจริงและสถิติของเลขนั้น</p>
      </div><div>
        <div class="chance">${pct(st.p)}<small>โอกาสที่เลขใดก็ตามจะถูก${esc(st.tier.label)}ในงวดหน้า
        — เท่ากันทุกเลข คิดเป็น 1 ใน ${group(Math.round(st.space / st.perDraw))}</small></div>
      </div></div>`;
  }

  const count = st.counts.get(n) || 0;
  const z = st.sd > 0 ? (count - st.expected) / st.sd : 0;
  const tag = count === 0
    ? `<span class="tag zero">ไม่เคยออกเลยตลอด ${group(DATES.length)} งวด</span>`
    : Math.abs(z) <= 2
      ? `<span class="tag norm">ต่างจากค่าคาดในระดับที่ความบังเอิญปกติอธิบายได้</span>`
      : z > 2
        ? `<span class="tag high">ออกบ่อยกว่าค่าคาดอย่างเห็นได้ชัด</span>`
        : `<span class="tag low">ออกน้อยกว่าค่าคาดอย่างเห็นได้ชัด</span>`;

  const lastDate = st.last.get(n);
  const ranked = [...st.counts.entries()].sort((a, b) => b[1] - a[1]);
  const rank = ranked.findIndex(([k]) => k === n) + 1;

  const years = [...new Set(DATES.map((d) => Number(d.slice(0, 4))))].sort();
  const hits = st.byYear.get(n) || new Map();
  const strip = years.map((y) => {
    const c = hits.get(y) || 0;
    return `<i class="${c >= 2 ? "hit2" : c === 1 ? "hit" : ""}" title="${y + 543}: ออก ${c} ครั้ง">${
      String(y + 543).slice(-2)}</i>`;
  }).join("");

  const ahead = (k) => pct(1 - Math.pow(1 - st.p, k));

  return `<div class="odds">
    <div>
      <span class="meta">เลขที่เลือก · ${esc(st.tier.label)}</span>
      <div class="bignum">${esc(n)}</div>
      ${tag}
      <div class="years">${strip}</div>
      <p class="meta" style="margin-top:10px">ช่องคือปี พ.ศ. ทึบ = ปีที่เลขนี้ออก</p>
    </div>
    <div>
      <div class="chance">${pct(st.p)}<small>โอกาสถูกในงวดหน้า คิดเป็น 1 ใน
        ${group(Math.round(st.space / st.perDraw))} — เท่ากันทุกเลข ไม่ว่าสถิติจะเป็นอย่างไร</small></div>
      <div class="facts">
        <div class="fact"><span>เคยออกมาแล้ว</span><b>${count} ครั้ง</b></div>
        <div class="fact"><span>ค่าคาดตามทฤษฎีในช่วงเวลาเท่ากัน</span><b>${st.expected.toFixed(1)} ครั้ง</b></div>
        <div class="fact"><span>อันดับความถี่</span><b>${
          count ? `ที่ ${group(rank)} จาก ${group(st.space)}` : "—"}</b></div>
        <div class="fact"><span>ออกครั้งล่าสุด</span><b>${
          lastDate ? `${esc(thaiDate(lastDate))} · ห่างมาแล้ว ${gapOf(lastDate)} งวด` : "ยังไม่เคยออก"}</b></div>
        <div class="fact"><span>ถ้าซื้อเลขนี้ทุกงวด 1 ปี (24 งวด)</span><b>มีโอกาสถูกอย่างน้อยครั้งเดียว ${ahead(24)}</b></div>
      </div>
    </div>
  </div>
  <p class="truth">
    <b>อ่านตัวเลขพวกนี้อย่างไร:</b> การออกรางวัลแต่ละงวดเป็นอิสระจากงวดก่อนหน้า
    เลขที่ออกบ่อยหรือหายไปนานจึงไม่ได้มีโอกาสถูกงวดหน้าต่างจากเลขอื่นเลย — ทุกเลขอยู่ที่
    <b>${pct(st.p)}</b> เท่ากันหมด สถิติในหน้านี้ใช้เลือกตามความชอบและความสบายใจได้
    แต่ไม่ได้ทำให้โอกาสถูกเพิ่มขึ้น และเมื่อดูพร้อมกันทั้ง ${group(st.space)} เลข
    ย่อมมีบางเลขที่ดูโดดกว่าค่าคาดได้เองตามธรรมชาติ
  </p>`;
}

function renderOdds() {
  const st = tierStats(view.pickTier);
  let rows = [...Array(st.space).keys()].map((i) => {
    const n = String(i).padStart(st.tier.digits, "0");
    const c = st.counts.get(n) || 0;
    const d = st.last.get(n);
    return { n, c, d, gap: d ? gapOf(d) : null };
  });

  if (view.strategy === "never") rows = rows.filter((r) => r.c === 0);
  else if (view.strategy === "hot") rows.sort((a, b) => b.c - a.c || a.n.localeCompare(b.n));
  else if (view.strategy === "cold") rows.sort((a, b) => a.c - b.c || a.n.localeCompare(b.n));
  else rows.sort((a, b) => (b.gap ?? 1e9) - (a.gap ?? 1e9) || a.n.localeCompare(b.n));
  rows = rows.slice(0, 40);

  const top = Math.max(...rows.map((r) => r.c), 1);
  const label = { hot: "ออกบ่อยสุด", cold: "ออกน้อยสุด", due: "หายไปนานสุด", never: "ยังไม่เคยออกเลย" }[view.strategy];

  return `<section class="panel">${oddsCard(st)}</section>
    <section class="panel">
      <div class="panel-head">
        <h2>${esc(st.tier.label)} · ${label}</h2>
        <span class="meta">กดแถวเพื่อดูโอกาสและสถิติของเลขนั้น · ค่าคาดตามทฤษฎี ${
          st.expected.toFixed(1)} ครั้งต่อเลข</span>
      </div>
      <div class="ranks">${rows.map((r, i) => `
        <div class="rank tap" data-pick="${r.n}" style="cursor:pointer">
          <span class="pos">${i + 1}</span>
          <span class="num">${r.n}</span>
          <span class="track"><span class="fill" style="width:${Math.max(3, r.c / top * 100)}%"></span></span>
          <span class="val">${r.c} ครั้ง${r.gap !== null ? ` · ห่าง ${r.gap} งวด` : " · ไม่เคยออก"}</span>
        </div>`).join("")}</div>
    </section>`;
}

function wireOdds() {
  document.querySelectorAll("[data-pick]").forEach((el) =>
    el.addEventListener("click", () => {
      view.pick = el.dataset.pick;
      const box = document.getElementById("pickBox");
      if (box) box.value = view.pick;
      const stage = document.getElementById("stage");
      stage.innerHTML = renderOdds(); wireOdds();
      stage.scrollIntoView({ behavior: "smooth", block: "start" });
    }));
}

function render() {
  for (const host of [document.getElementById("topnav"), document.getElementById("quick")]) {
    for (const b of host.children) b.setAttribute("aria-selected", String(b.dataset.view === view.name));
  }
  renderBar();
  const stage = document.getElementById("stage");
  if (view.name === "grid") { stage.innerHTML = renderGrid(); wireGrid(); }
  else if (view.name === "draw") { stage.innerHTML = renderDraw(); wireDraw(); }
  else if (view.name === "ticket") { stage.innerHTML = renderTicket(); paintTicket(); }
  else if (view.name === "odds") { stage.innerHTML = renderOdds(); wireOdds(); }
  else { stage.innerHTML = renderStats(); }
}

render();
</script>
